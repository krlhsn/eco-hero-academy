[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-hero-academy"
version = "2.0.0"
description = "A local-first, gamified community recycling education CLI."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Kamrul Hassan"}]
keywords = ["recycling", "environment", "education", "quiz", "sustainability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Games/Entertainment :: Trivia",
]

[project.scripts]
eco-hero = "eco_hero.cli:main"

[tool.setuptools.packages.find]
include = ["eco_hero*"]
