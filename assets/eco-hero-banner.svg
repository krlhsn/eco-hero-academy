<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Eco-Hero Academy</title>
  <desc id="desc">Forest-green banner with one clean circular arrow and a leaf emblem beside the project title.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092d25"/>
      <stop offset="0.55" stop-color="#14533f"/>
      <stop offset="1" stop-color="#0b382e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8edc9"/>
      <stop offset="1" stop-color="#45b987"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="940" cy="205" r="174" fill="#f4cf79" opacity=".08"/>
  <circle cx="940" cy="205" r="139" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>

  <!-- One continuous circular arrow. Its single arrowhead is kept clear of the leaf. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 940 88 A 117 117 0 1 1 831 145" stroke="#f3cb6e" stroke-width="15"/>
    <path d="M 858 116 L 830 145 L 868 151" stroke="#f3cb6e" stroke-width="15"/>
  </g>
  <!-- Separate leaf mark with a clear gap from the circular arrow. -->
  <g transform="translate(940 207)">
    <path d="M -7 59 C -79 52 -91 -15 -43 -62 C -2 -50 16 -5 -7 59 Z" fill="url(#leaf)"/>
    <path d="M 10 59 C 78 43 89 -16 45 -62 C 7 -49 -12 -5 10 59 Z" fill="#f3cb6e"/>
    <path d="M 1 61 L 2 -43 M 0 25 L -35 -20 M 3 15 L 36 -23" fill="none" stroke="#174b38" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="143" fill="#fffaf0" font-size="59" font-weight="700" letter-spacing="-1.5">Eco-Hero Academy</text>
    <rect x="82" y="171" width="610" height="5" rx="2.5" fill="#f3cb6e"/>
    <text x="82" y="232" fill="#fffaf0" font-size="32" font-weight="600">Community Recycling Guide</text>
    <text x="82" y="278" fill="#c9e5d8" font-size="21">Learn smarter habits. Take the challenge. Make a difference.</text>
    <g transform="translate(82 320)">
      <rect width="142" height="42" rx="21" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".24"/>
      <text x="71" y="27" text-anchor="middle" fill="#fffaf0" font-size="14" font-weight="700" letter-spacing="1">DISCOVER</text>
      <rect x="158" width="142" height="42" rx="21" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".24"/>
      <text x="229" y="27" text-anchor="middle" fill="#fffaf0" font-size="14" font-weight="700" letter-spacing="1">CHALLENGE</text>
      <rect x="316" width="142" height="42" rx="21" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".24"/>
      <text x="387" y="27" text-anchor="middle" fill="#fffaf0" font-size="14" font-weight="700" letter-spacing="1">LEVEL UP</text>
    </g>
  </g>
</svg>
